aid: draftpilotai
name: DraftPilot.ai
description: >-
  DraftPilot.ai is an AI-powered contract redlining product for in-house legal
  teams, delivered as a Microsoft Word add-in. It reviews and marks up contracts
  against a company's own playbooks in minutes, flagging issues and suggesting
  edits as tracked changes directly inside Word, with no CLM change required.
  DraftPilot can generate playbooks from template contracts or prior mark-ups,
  redraft clauses, and onboard in about three minutes. Founded in 2024 and based
  in London (Daniel Van Binsbergen, founder of Lexoo), the company is backed by
  500 Global and was selected by Axiom to power its Tech+Talent AI contracting
  initiative. It maintains SOC 2 Type II and ISO 27001 certifications, AES-256
  encryption at rest, TLS in transit, GDPR/UK GDPR compliance, and does not use
  customer data for model training. DraftPilot does not publish a public API,
  SDKs, or developer documentation; it is a productized legal-AI application.
